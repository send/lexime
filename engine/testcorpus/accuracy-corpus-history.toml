# Lexime Conversion Accuracy Corpus — with History
#
# This file tests that user history (learning) correctly influences
# conversion results. Each [[history]] entry seeds the in-memory
# UserHistory before running the test cases.
#
# Usage:
#   mise run accuracy-history                        # Run all cases
#   mise run accuracy-history -- --tag homophone     # Filter by tag
#   mise run accuracy-history -- --verbose           # Show passing cases too
#   mise run accuracy-history -- --json              # JSON output
#
# Rules:
#   - skip 以外は全 pass を維持する。fail があれば修正するか skip にする
#   - skip には必ず issue リンクを付ける（理由なし skip 禁止）
#   - baseline がずれた場合は辞書・コスト変更を確認し baseline 値を更新する
#   - コスト調整・reranker 変更時は事前に mise run accuracy-history で現状確認し、
#     PR に before/after の結果を貼る
#   - 新規ケースには baseline（履歴なし結果）を必ず付ける
#   - Fields are the same as accuracy-corpus.toml (see its header), including
#     window_top1 / width_issue and [cases.window]. Here a [cases.window] must
#     be followed by [cases.window.baseline] (the no-history window, like
#     `baseline` for top-1). `baseline` is checked at every width too.
#   - [[history]] records only the segments listed. The live engine also
#     records the whole (reading, surface) pair, so a case that depends on
#     whole-path learning must list that pair as its own entry.
#
# History fields:
#   segments  (required) - [(reading, surface)] pairs passed to record_at
#   repeat    (optional) - Number of times to record (default: 1)
#
# Case fields:
#   reading   (required) - Kana input to convert
#   expected  (required) - Expected top-1 surface output (with history)
#   baseline  (optional) - Expected top-1 surface output without history
#   category  (required) - One of: word, phrase, conjugation, regression,
#                          loanword, numeric, compound
#   tags      (optional) - Descriptive tags for filtering
#   skip      (optional) - true if this is a known failure (issue required)
#   note      (optional) - Explanation of the test case or known issue
#   issue     (optional) - Related GitHub issue number (e.g. "#123")
#   pr        (optional) - Related GitHub PR number (e.g. "#456")

# ═══════════════════════════════════════════════════════════════════
# History records — seeded before test execution
# ═══════════════════════════════════════════════════════════════════

[[history]]
segments = [["かんじ", "漢字"]]
repeat = 5

[[history]]
segments = [["きょうは", "今日は"], ["いい", "いい"], ["てんき", "天気"]]
repeat = 3

[[history]]
segments = [["きかい", "機械"]]
repeat = 5

[[history]]
segments = [["かい", "買い"], ["ました", "ました"]]
repeat = 5

[[history]]
segments = [["かい", "書い"], ["て", "て"]]
repeat = 5

[[history]]
segments = [["せんせい", "先生"], ["に", "に"], ["しつもん", "質問"], ["し", "し"], ["た", "た"]]
repeat = 5

[[history]]
segments = [["けん", "券"]]
repeat = 2

[[history]]
segments = [["さん", "さん"], ["ど", "℃"]]
repeat = 2

[[history]]
segments = [["おねがいします", "お願いします"]]
repeat = 5

# Cost-gap admission: 田辺留 committed once for the whole reading (the live
# engine records the whole pair and the segments as separate records).
# Like every [[history]] entry these apply to all cases in this file: a case
# whose lattice has た→田, べる→辺留 or たべる→食べる picks up their boosts.
[[history]]
segments = [["たべる", "食べる"]]
repeat = 3

[[history]]
segments = [["たべる", "田辺留"]]
repeat = 1

[[history]]
segments = [["た", "田"], ["べる", "辺留"]]
repeat = 1

# ═══════════════════════════════════════════════════════════════════
# Word-level history override
# ═══════════════════════════════════════════════════════════════════

[[cases]]
reading = "かんじ"
expected = "漢字"
baseline = "感じ"
category = "word"
tags = ["history", "homophone"]
note = "学習により感じ→漢字に逆転"

[[cases]]
reading = "きかい"
expected = "機械"
baseline = "機会"
category = "word"
tags = ["history", "homophone"]
note = "学習により機会→機械に逆転"

[[cases]]
reading = "かいました"
expected = "買いました"
baseline = "買い増した"
category = "conjugation"
tags = ["history", "verb", "polite-past"]
note = "学習により買い増した→買いました に逆転"

# ═══════════════════════════════════════════════════════════════════
# Phrase-level history
# ═══════════════════════════════════════════════════════════════════

[[cases]]
reading = "きょうはいいてんき"
expected = "今日はいい天気"
baseline = "今日はいい天気"
category = "phrase"
tags = ["history", "particle"]
note = "resegmentation + FW length variance exclusion で Viterbi top-1 が今日はいい天気に改善"

# ═══════════════════════════════════════════════════════════════════
# Conjugation-level history override
# ═══════════════════════════════════════════════════════════════════

[[cases]]
reading = "かいて"
expected = "書いて"
baseline = "買い手"
category = "conjugation"
tags = ["history", "verb", "te-form"]
note = "学習により買い手→書いて に逆転"

# ═══════════════════════════════════════════════════════════════════
# Phrase-level history (suru-verb)
# ═══════════════════════════════════════════════════════════════════

[[cases]]
reading = "せんせいにしつもんした"
expected = "先生に質問した"
baseline = "先生に質問した"
category = "phrase"
tags = ["history", "suru-verb"]
note = "1-char variance exclusion により baseline が質問した に改善; 履歴なしでも正しい"

# ═══════════════════════════════════════════════════════════════════
# Regression: post-history rewriter must not inherit whole-path boost
# ═══════════════════════════════════════════════════════════════════

[[cases]]
reading = "おねがいします"
expected = "お願いします"
baseline = "お願いします"
category = "regression"
tags = ["history", "whole-path", "rewriter"]
note = "学習済み お願いします が候補上位に出る。以前は history_rerank 後の KanjiVariantRewriter が boost 済みひらがなパスから漢字バリアントを量産し、その継承コストで お願いします を2ページ目に押し下げていた (pre_history_cost で修正)。baseline は Mozc 2026-07 スナップショットのコスト変更で おねがいします → お願いします に変化 (#273)"
pr = "#248"

# ═══════════════════════════════════════════════════════════════════
# Numeric: the 1-best prices number compounds from the same anchor as N-best
# ═══════════════════════════════════════════════════════════════════

[[cases]]
reading = "にけん"
expected = "二件"
baseline = "二件"
category = "numeric"
tags = ["history", "numeric", "counter", "width"]
note = "けん→券 の学習 (per-segment) で に|券 が Viterbi #1 を抜くが、#1 からの差は数詞複合語の割引 500 未満。数詞複合語は履歴前の #1 (anchor) − 500 で値付けされ、1-best でも N-best でも 二件 が #1。以前の 1-best は学習済み #1 から値付けして に券 を出し、候補リストの先頭 (二件) とずれていた"

# 前提の固定: に|券 が学習で履歴前の #1 (二軒) を抜いていること。抜かなくなると旧コードでも 二件 になり、このケースが修正を守らなくなる
[cases.window]
n = 2
present_nbest = ["に券"]

[cases.window.baseline]
absent = ["に券"]

[[cases]]
reading = "さんど"
expected = "さん℃"
baseline = "三度"
category = "numeric"
tags = ["history", "numeric", "counter", "width", "partial-hiragana"]
note = "さん|℃ を 2 回選んだ履歴 (per-segment)。さん℃ は 3|℃ の表記ゆれ提示 (かなノード さん、src+2000 上限) で、実経路 さん|℃ が 1-best の oversample に入っているかどうかに関わらず同じ価格になる。以前は実経路が oversample 外の 1-best だけ方針価格で さん℃、N-best は 三度 と幅で割れていた"

# ═══════════════════════════════════════════════════════════════════
# Cost-gap admission: a surface committed for the reading stays
# ═══════════════════════════════════════════════════════════════════

[[cases]]
reading = "たべる"
expected = "食べる"
baseline = "食べる"
category = "regression"
tags = ["history", "whole-path", "admission"]
note = "田|辺留 は履歴なしで #1 との差 17841 > max_cost_gap で N-best から落ちる (複数分節なので lookup にも無い。RC-2 の 田辺る 型)。読み全体を 田辺留 で 1 回確定した履歴 (whole ペア) があれば admission は落とさない。食べる (×3) は #1 のまま。成立する T の上限は gap − 2000 = 15841 — T がそれを超えたら、新しい T + 2000 以上の gap を持つ表記に選び直す (無ければケースごと差し替え)"

[cases.window]
n = 20
present_nbest = ["田辺留"]

[cases.window.baseline]
absent = ["田辺留"]
