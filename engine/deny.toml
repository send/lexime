# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # bincode 1.3.3 is unmaintained but stable; migrate to postcard later
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is stable, migration planned" },
    # zip 7.2.0: all three advisories are in ZipArchive / ZipStreamReader
    # extract() (symlinks and permission bits applied on extraction). lexime
    # never calls extract(): candle-core 0.10.2 uses zip under the `neural`
    # feature only (not shipped), and lex-cli's dev-only Sudachi miner
    # (candidates/sudachi.rs) reads entries by index and writes each to a
    # basename it chooses. The fix needs zip >= 9; candle (0.11 too) still
    # requires zip < 9, so bumping lex-cli alone would leave 7.2.0 in the tree.
    # Remove these lines when candle allows zip >= 9 (then bump lex-cli too),
    # or when the neural feature is removed and lex-cli has moved.
    { id = "RUSTSEC-2026-0367", reason = "zip extract() only; lexime never calls extract(); fix needs zip >= 9, blocked by candle" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract() only; lexime never calls extract(); fix needs zip >= 9, blocked by candle" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract() only; lexime never calls extract(); fix needs zip >= 9, blocked by candle" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",          # uniffi
    "Unlicense",         # memchr
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

# Workspace crates don't have a license field yet
[[licenses.clarify]]
name = "lex-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "lex-session"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "lex_engine"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"  # workspace path deps are flagged as wildcards
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
