# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
# An ignore whose advisory no longer matches the lock fails the audit, so a
# stale ignore cannot outlive the dependency it excused.
unused-ignored-advisory = "deny"
ignore = [
    # bincode 1.3.3 is unmaintained but stable; migrate to postcard later
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is stable, migration planned" },
    # zip 7.2.0: all three advisories are in its extraction API —
    # ZipArchive::extract, ZipArchive::extract_unwrapped_root_dir and
    # ZipStreamReader::extract (archive symlinks and permission bits applied on
    # extraction). lexime never calls it, and engine/clippy.toml's
    # disallowed-methods makes a call fail the lint. zip reaches the tree two
    # ways: candle-core depends on it unconditionally, but candle itself comes
    # only from lexime's non-shipped `neural` feature (it reads .npy archives,
    # no extraction); lex-cli's dev-only Sudachi miner (candidates/sudachi.rs)
    # reads entries with by_index + io::copy and writes each to
    # dest/<the entry's basename>. The fix needs zip >= 9; candle (0.10.2: ^7.2,
    # 0.11: ^8.6) does not allow it yet, so bumping lex-cli alone would leave
    # 7.2.0 in the tree. Remove these lines once no 7.x zip is left in the
    # lock: candle allows zip >= 9 (or the neural feature is removed) AND
    # lex-cli's zip requirement is >= 9. unused-ignored-advisory = "deny" then
    # fails the audit until they go.
    { id = "RUSTSEC-2026-0367", reason = "zip 7.2.0 extraction API, never called (clippy disallowed-methods); see the note above" },
    { id = "RUSTSEC-2026-0368", reason = "zip 7.2.0 extraction API, never called (clippy disallowed-methods); see the note above" },
    { id = "RUSTSEC-2026-0369", reason = "zip 7.2.0 extraction API, never called (clippy disallowed-methods); see the note above" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",          # uniffi
    "Unlicense",         # memchr
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

# Workspace crates don't have a license field yet
[[licenses.clarify]]
name = "lex-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "lex-session"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "lex_engine"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"  # workspace path deps are flagged as wildcards
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
