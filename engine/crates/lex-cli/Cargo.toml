[package]
name = "lex-cli"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
name = "lex_cli"

[[bin]]
name = "dictool"
path = "src/bin/dictool.rs"

[[bin]]
name = "lextool"
path = "src/bin/lextool.rs"

[dependencies]
lex-core = { path = "../lex-core" }
clap = { workspace = true }
ureq = "3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# Used by `dictool candidates mine` only — SudachiDict releases ship as ZIP.
# Kept as a hard dep (not optional) since the CLI is a build/dev tool and
# not shipped with the IME itself.
# 9.0.5 is a security floor (GHSA-m665-v7pm-7grj, Zip Cloaking). The advisory
# is GHSA-only (not in RustSec, which cargo deny reads), so
# scripts/check-ghsa.py is what catches a lockfile below it; the floor stays
# as the manifest-level guard.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Used by `dictool candidates corpus` only — Wikipedia dumps ship as bz2.
# Streaming decompress so we never materialize the full ~14GB XML on disk.
bzip2 = "0.4"
