[package]
name = "lex-core"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
name = "lex_core"

[features]
default = []
trace = ["tracing/max_level_debug"]
neural = ["candle-core", "candle-nn", "dep:anyhow"]

[dependencies]
tracing = { workspace = true }
lexime-trie = "=0.5.0"
serde = { workspace = true }
bincode = "1"
crc32fast = "1"
thiserror = { workspace = true }
memmap2 = "0.9"
toml = { workspace = true }
time = { version = "0.3", features = ["local-offset"] }
unicode-width = "0.2"
anyhow = { version = "1", optional = true }
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }

[target.'cfg(unix)'.dependencies]
# Two uses, one Apple-only and one every-unix, which is why this is `cfg(unix)`
# and not `cfg(target_vendor = "apple")`:
#
# - `fcntl(F_BARRIERFSYNC)` for the WAL write barrier, Apple-gated at its call
#   site: std's `sync_data` maps to F_FULLFSYNC there (~4ms vs ~0.3ms on
#   M-series).
# - `O_NOFOLLOW | O_NONBLOCK` in `persist::regular_only`, which every unix
#   target needs. Leaving this table Apple-only made that code build on the
#   macOS host and fail to resolve `libc` on Linux CI — a break a macOS-only
#   local gate cannot see.
libc = "0.2"

[build-dependencies]
toml = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "converter"
harness = false

[[bench]]
name = "candidates"
harness = false
