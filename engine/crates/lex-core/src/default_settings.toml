[cost]
segment_penalty = 5000
mixed_script_bonus = 3000
# Tie-breaker only. Was 5000, which overrode the dictionary's own cost
# ordering: in 9 of the 14 katakana misses mined in #261 the katakana path
# had the lowest raw Viterbi cost and lost purely to this penalty (vs the
# mixed-script bonus on the kanji competitor). 150 keeps hiragana ahead on
# near-ties but lets the dictionary decide otherwise. Measurements: #261.
katakana_penalty = 150
pure_kanji_bonus = 1000
latin_penalty = 20000
unknown_word_cost = 10000

[reranker]
length_variance_weight = 1000
# Upper bound above the pre-history #1's structure cost; a single-segment #1
# counts as min(structure_cost_filter / 2, structure_cost_transition_cap)
# (#353; before, above the population's minimum — the same value is now the
# same or looser).
structure_cost_filter = 6000
te_form_kanji_penalty = 2000
single_char_kanji_penalty = 0
structure_cost_transition_cap = 5000

[history]
boost_per_use = 3000
max_boost = 15000
half_life_hours = 168.0
max_unigrams = 10000
max_bigrams = 10000

[candidates]
nbest = 20
max_results = 20
# Upper bound on a candidate's cost above the pre-history #1 (rerank best).
# Never below the kana-rescue band (4000): a smaller value acts as 4000.
# Always kept: #1, a surface the user has committed for this reading (whole
# or as a phrase segment), the typed kana. 9223372036854775807 (i64::MAX)
# disables the bound. How the default was chosen: DEFAULT_CANDIDATE_MAX_COST_GAP.
max_cost_gap = 8000

[snippets]
trigger = "ctrl+shift+/"

[keymap]
# key_code = ["normal", "shifted"]
# macOS bug: keyCode 10 returns § instead of ] on JIS keyboards
10 = ["]", "}"]
# ¥ key → backslash (replaces programmer_mode)
93 = ["\\", "|"]
