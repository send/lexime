name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      !endsWith(github.actor, '[bot]') && (
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          (
            github.event.review.author_association == 'OWNER' ||
            github.event.review.author_association == 'MEMBER' ||
            github.event.review.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          (
            github.event.issue.author_association == 'OWNER' ||
            github.event.issue.author_association == 'MEMBER' ||
            github.event.issue.author_association == 'COLLABORATOR'
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      # The screen in `mise run lint` / `test` needs origin/main (see
      # scripts/screen.sh). A depth-1 checkout has it only on the issue
      # events, whose ref is main, not on the PR review events.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for quarantine diff against main

      # So the bot lints and formats through mise.toml's [tasks.lint] /
      # [tasks.fmt], as CI's lint job does. Stricter than ci.yml because this
      # job holds a secret and an agent shell runs after this step:
      #   - cache: false — a restored mise dir puts its shims/ on PATH ahead of
      #     that shell, and sha256 covers bin/mise only.
      #   - github_token: '' — the action otherwise exports GITHUB_TOKEN to
      #     every later step. It then warns "No GITHUB_TOKEN provided" each
      #     run; expected, as nothing here fetches tools (install: false).
      # To bump: pick a mise release at least 7 days old, and take sha256 of
      # mise/bin/mise from its linux-x64 tarball, checked against the
      # release's SHASUMS256.txt.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2026.9.11
          sha256: 6e39ee1ffa926a1f64814efbf1d26c3f617255e2a6ba6152e3c8a5135fa5a35f # mise/bin/mise, linux-x64
          install: false
          cache: false
          github_token: ''

      # The mise rules are exact matches, not `:*` prefixes: a prefix would
      # also admit `mise run lint ::: <any task>` (mise runs every task after
      # `:::`). No raw cargo, not even a targeted `cargo test -p`: every build
      # here must pass the supply-chain screen, and only the mise tasks carry
      # it (see [tasks.screen] in mise.toml). `mise run fmt` does not build,
      # and stands in for `cargo fmt` for the pinned rustfmt.
      # SCREEN_POLICY_REF: the screen reads its baseline and allowlist from
      # main, not from the tree Claude can edit (scripts/screen.sh). A PR
      # that adds a build.rs crate or a quarantine exception therefore fails
      # the bot's lint/test until that change has merged.
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@26ddc358fe3befff50c5ec2f80304c90c763f6f8 # v1
        env:
          SCREEN_POLICY_REF: origin/main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: "Bash(mise run lint),Bash(mise run test),Bash(mise run fmt),Bash(gh pr:*)"
