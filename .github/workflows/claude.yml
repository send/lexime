name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      !endsWith(github.actor, '[bot]') && (
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          (
            github.event.review.author_association == 'OWNER' ||
            github.event.review.author_association == 'MEMBER' ||
            github.event.review.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          (
            github.event.issue.author_association == 'OWNER' ||
            github.event.issue.author_association == 'MEMBER' ||
            github.event.issue.author_association == 'COLLABORATOR'
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # mise so the bot lints and formats through mise.toml's [tasks.lint] /
      # [tasks.fmt] on the pinned toolchain, like CI's lint job, rather than on
      # floating stable with a hand-copied flag list. Stricter than ci.yml's
      # mise-action because this job holds a secret and runs before
      # claude-code-action: the action and the mise binary are pinned by hash;
      # cache: false so the binary always comes from that pinned download; and
      # github_token: '' because the action otherwise exports GITHUB_TOKEN to
      # every later step, the bot's shell included. install: false as in
      # ci.yml — mise.toml declares no [tools].
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2026.9.11
          sha256: 6e39ee1ffa926a1f64814efbf1d26c3f617255e2a6ba6152e3c8a5135fa5a35f # mise/bin/mise, linux-x64
          install: false
          cache: false
          github_token: ''

      # The mise rules are exact matches, not `:*` prefixes: a prefix would
      # also admit `mise run lint ::: <any task>` (mise runs every task after
      # `:::`) and `mise run test-swift`, and these tasks take no arguments.
      # Raw `cargo fmt` / `cargo clippy` are deliberately absent — on stable
      # they can disagree with the pinned toolchain CI lints with. `cargo test`
      # / `cargo check` stay for targeted runs: `mise run test` takes no
      # arguments, and CI's test jobs run on stable too.
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@26ddc358fe3befff50c5ec2f80304c90c763f6f8 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: "Bash(mise run lint),Bash(mise run test),Bash(mise run fmt),Bash(cargo test:*),Bash(cargo check:*),Bash(cd engine && cargo test:*),Bash(cd engine && cargo check:*),Bash(gh pr:*)"
