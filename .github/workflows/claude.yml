name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Not `edited`: every edit of an issue that mentions @claude would start
  # another paid run.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

# As in ci.yml: mise reads only mise.toml, so a committed .mise.toml or
# mise.local.toml cannot redefine lint/test and drop their screen.
env:
  MISE_OVERRIDE_CONFIG_FILENAMES: mise.toml

jobs:
  claude:
    if: |
      !endsWith(github.actor, '[bot]') && (
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          (
            github.event.review.author_association == 'OWNER' ||
            github.event.review.author_association == 'MEMBER' ||
            github.event.review.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          (
            github.event.issue.author_association == 'OWNER' ||
            github.event.issue.author_association == 'MEMBER' ||
            github.event.issue.author_association == 'COLLABORATOR'
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      # The screen in `mise run lint` / `test` needs origin/main (see
      # scripts/screen.sh). A depth-1 checkout has it only on the issue
      # events, whose ref is main, not on the PR review events.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # So the bot lints and formats through mise.toml's [tasks.lint] /
      # [tasks.fmt], as CI's lint job does. Not through
      # .github/actions/setup-mise, and stricter than it, because this job
      # holds a secret and an agent shell runs after this step:
      #   - version and sha256 are spelled out here, as nothing from the
      #     checkout may run before the Claude step. CI holds them to the pin:
      #     ci.yml's read-pin job fails when `version:` is not `min_version` in
      #     mise.toml, or `sha256:` is not the linux-x64 bin/mise it installs
      #     at that version.
      #   - cache: false — setup-mise sets it too, but here it is load-bearing:
      #     a restored mise dir puts its shims/ on PATH ahead of that shell,
      #     and sha256 covers bin/mise only.
      #   - github_token: '' — mise fetches nothing here (install: false), so
      #     it gets no token; the Claude step passes its own. The action then
      #     warns "No GITHUB_TOKEN provided" each run; expected.
      # To bump, follow mise.toml's procedure; take sha256 of mise/bin/mise
      # from the release's linux-x64 tarball, checked against its
      # SHASUMS256.txt.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2026.9.11
          sha256: 6e39ee1ffa926a1f64814efbf1d26c3f617255e2a6ba6152e3c8a5135fa5a35f # mise/bin/mise, linux-x64
          install: false
          cache: false
          github_token: ''

      # Two settings that had never worked until #336 found them:
      # - github_token: this job's own token, so the bot holds exactly the
      #   permissions above. Without it the action wants the Claude GitHub
      #   App's token over OIDC (needs `id-token: write`). The action also
      #   gives this token to Claude's shell for `gh`. The git commit/push
      #   tools tag mode adds get a 403 at push, as contents is read-only.
      # - Tool rules go in claude_args: v1 has no `allowed_tools` input. The
      #   action adds its read, comment, CI and git tools, and acceptEdits
      #   lets it edit files in the workspace; no other build or gh command
      #   is allowed.
      #   That is not a sandbox: `mise run lint` / `test` execute workspace
      #   code, so treat the bot as able to run anything with its tokens.
      #   `gh pr` is read-only here — pull-requests: write would otherwise
      #   let it close, edit or approve PRs.
      # The mise rules are exact matches, not `:*` prefixes: a prefix would
      # also admit `mise run lint ::: <any task>` (mise runs every task after
      # `:::`). No raw cargo, not even a targeted `cargo test -p`: every build
      # here must pass the supply-chain screen, and only the mise tasks carry
      # it ([tasks.screen]). It cannot be a step before this one: the action
      # checks out the PR branch after every earlier step, and Claude can edit
      # Cargo.lock between commands, so it runs inside each command. `mise run
      # fmt` does not build, and stands in for `cargo fmt` for the pinned
      # rustfmt.
      # SCREEN_POLICY_REF: see scripts/screen.sh. A PR that adds a build.rs
      # crate or a quarantine exception fails the bot's lint/test until merged.
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@26ddc358fe3befff50c5ec2f80304c90c763f6f8 # v1
        env:
          SCREEN_POLICY_REF: origin/main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --allowedTools "Bash(mise run lint),Bash(mise run test),Bash(mise run fmt),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*)"
