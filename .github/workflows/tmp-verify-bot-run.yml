# TEMPORARY: removed before merge. Runs the Claude step of claude.yml on this PR to verify it.
---
name: tmp-verify-bot-run
'on':
  pull_request:
jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
      with:
        version: 2026.9.11
        sha256: 6e39ee1ffa926a1f64814efbf1d26c3f617255e2a6ba6152e3c8a5135fa5a35f
        install: false
        cache: false
        github_token: ''
    - name: Run Claude Code
      id: claude
      uses: anthropics/claude-code-action@26ddc358fe3befff50c5ec2f80304c90c763f6f8
      with:
        claude_code_oauth_token: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}"
        github_token: "${{ github.token }}"
        claude_args: --allowedTools "Bash(mise run lint),Bash(mise run test),Bash(mise
          run fmt),Bash(cargo test:*),Bash(cargo check:*),Bash(gh pr view:*),Bash(gh
          pr diff:*),Bash(gh pr checks:*)"
        show_full_output: true
        prompt: |
          This is an automated permission check of this workflow. Do not edit any files.
          Run each command below with the Bash tool exactly as written, one at a time, and note whether it was ALLOWED (and its key output) or DENIED by permissions:
          1. mise run lint
          2. mise run lint ::: reload
          3. cargo clippy --version
          4. cd engine && cargo check --version
          5. gh pr view ${{ github.event.pull_request.number }} --json state --jq .state
          Finish with one line per command in the form: RESULT <n> ALLOWED|DENIED <short note>
