name: Lint canary

# Runs the lint gate on floating `stable` instead of the pin in
# engine/lint-toolchain.txt. A signal, not a gate: nothing here runs on
# pull_request or push, so it can never block a PR. When stable is ahead of
# the pin, it opens or updates one tracking issue: "behind" (new lints fire, so
# the run is red) or "free bump" (stable passes as-is). Once the pin catches up
# it closes that issue.
on:
  schedule:
    # Mondays 03:17 UTC. Stable releases land on Thursdays every 6 weeks, so
    # a new clippy is reported within 4 days.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-canary
  cancel-in-progress: false

jobs:
  # Same screen as ci.yml, and for the same reason: cargo executes dependency
  # build scripts, so the quarantine / build.rs baseline checks run first. On
  # main the lockfile has already passed the screen, but workflow_dispatch can
  # target any branch.
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for quarantine diff against main

      - uses: dtolnay/rust-toolchain@stable

      - name: Quarantine check (7-day)
        run: bash scripts/check-quarantine.sh

      - name: build.rs baseline check
        run: bash scripts/check-build-scripts.sh

  canary:
    needs: screen
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.canary.outputs.state }}
      stable: ${{ steps.canary.outputs.stable }}
      pin: ${{ steps.canary.outputs.pin }}
      lints: ${{ steps.canary.outputs.lints }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # No rust-cache. With a weekly run the entry would sit right at the
      # 7-day eviction window, and stable changes every sixth week anyway.

      - uses: jdx/mise-action@v2
        with:
          install: false

      - name: Lint on stable
        id: canary
        run: bash scripts/lint-canary.sh stable

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          STATE: ${{ steps.canary.outputs.state }}
          STABLE: ${{ steps.canary.outputs.stable }}
          PIN: ${{ steps.canary.outputs.pin }}
          LINTS: ${{ steps.canary.outputs.lints }}
        run: |
          {
            echo "## Lint canary: ${STATE:-no result}"
            echo
            echo "| stable | pin | findings |"
            echo "|---|---|---|"
            echo "| ${STABLE:-?} | ${PIN:-?} | ${LINTS:-none} |"
            echo
            case $STATE in
              current) echo "Stable is not ahead of the pin. Nothing to do." ;;
              free-bump) echo "Stable passes lint as-is. Bumping the pin costs nothing." ;;
              behind) echo "Stable reports new findings. Bump the pin and fix them in the same PR." ;;
              *) echo "The canary did not produce a verdict. Read the log above; this is not a pin-age signal." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  # Split from `canary` so the job that executes dependency build scripts never
  # holds a token that can write issues.
  report:
    needs: canary
    if: >-
      !cancelled() &&
      contains(fromJSON('["current", "free-bump", "behind"]'), needs.canary.outputs.state)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATE: ${{ needs.canary.outputs.state }}
          STABLE: ${{ needs.canary.outputs.stable }}
          PIN: ${{ needs.canary.outputs.pin }}
          LINTS: ${{ needs.canary.outputs.lints }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/lint-canary-report.sh
