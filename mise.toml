[tasks.engine-lib]
description = "Build universal static library (x86_64 + aarch64)"
sources = ["engine/src/**/*.rs", "engine/crates/**/*.rs", "engine/crates/**/*.toml", "engine/Cargo.toml", "engine/Cargo.lock"]
outputs = ["build/liblex_engine.a"]
run = """
#!/usr/bin/env bash
set -euo pipefail
cd engine
cargo build --release --features trace --target x86_64-apple-darwin
cargo build --release --features trace --target aarch64-apple-darwin
cd ..
mkdir -p build
lipo -create \
  engine/target/x86_64-apple-darwin/release/liblex_engine.a \
  engine/target/aarch64-apple-darwin/release/liblex_engine.a \
  -output build/liblex_engine.a
"""

[tasks.uniffi-gen]
description = "Generate UniFFI Swift bindings from cdylib"
depends = ["engine-lib"]
sources = [
  "engine/src/**/*.rs",
  "engine/uniffi-bindgen.rs",
  "engine/crates/**/*.rs",
  "engine/crates/**/*.toml",
  "engine/Cargo.toml",
  "engine/Cargo.lock",
]
outputs = ["generated/lex_engine.swift", "generated/lex_engineFFI.h", "generated/lex_engineFFI.modulemap"]
run = """
#!/usr/bin/env bash
set -euo pipefail
cd engine
cargo build --release --features trace,uniffi-cli
cargo run --release --features uniffi-cli --bin uniffi-bindgen -- generate \
  --library target/release/liblex_engine.dylib \
  --language swift \
  --out-dir ../generated
cd ..
echo "Generated Swift bindings in generated/"
ls -la generated/
"""

# Pinned to the commit in engine/data/mozc-pin.txt so local runs and the CI
# accuracy job measure against the same upstream snapshot (issue #273). Bump
# procedure lives in the pin file's header comment. To fetch an unpinned
# (latest master) snapshot for a bump, run dictool fetch without --sha.
[tasks.fetch-dict-mozc]
description = "Download Mozc dictionary data (pinned to engine/data/mozc-pin.txt)"
sources = [
  "engine/crates/lex-cli/src/bin/dictool.rs",
  "engine/crates/lex-cli/src/dict_source/mod.rs",
  "engine/crates/lex-cli/src/dict_source/mozc.rs",
  "engine/data/mozc-pin.txt",
]
outputs = ["engine/data/mozc-raw/.stamp"]
run = """
#!/usr/bin/env bash
set -euo pipefail
# Extract the first 40-hex line (allowing surrounding whitespace) — comments
# in any form and junk lines are excluded by construction. An absent SHA line
# yields sha="" (grep's exit code is masked), which dictool then rejects with
# a clear "must be a full 40-hex SHA" error.
sha=$(grep -oE -m1 '^[[:space:]]*[0-9a-fA-F]{40}[[:space:]]*$' engine/data/mozc-pin.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]' || true)
cd engine && cargo run -p lex-cli --bin dictool -- fetch --source mozc --sha "$sha" data/mozc-raw
"""

[tasks.dict-mozc]
description = "Compile binary dictionary from Mozc"
depends = ["fetch-dict-mozc"]
sources = [
  "engine/data/mozc-raw/.stamp",
  "engine/data/mozc-raw/id.def",
  "engine/crates/**/*.rs",
  "engine/crates/**/*.toml",
  "engine/Cargo.toml",
  "engine/Cargo.lock",
]
outputs = ["engine/data/lexime-mozc.dict"]
run = """
#!/usr/bin/env bash
set -euo pipefail
cd engine
cargo build --release -p lex-cli --bin dictool
target/release/dictool compile --source mozc --id-def data/mozc-raw/id.def data/mozc-raw data/lexime-mozc.dict
"""

[tasks.conn]
description = "Compile Mozc connection cost matrix"
depends = ["fetch-dict-mozc"]
sources = [
  "engine/data/mozc-raw/connection_single_column.txt",
  "engine/data/mozc-raw/id.def",
  "engine/crates/**/*.rs",
  "engine/crates/**/*.toml",
  "engine/Cargo.toml",
  "engine/Cargo.lock",
]
outputs = ["engine/data/lexime.conn"]
run = """
#!/usr/bin/env bash
set -euo pipefail
cd engine
cargo build --release -p lex-cli --bin dictool
target/release/dictool compile-conn \
  --id-def data/mozc-raw/id.def \
  data/mozc-raw/connection_single_column.txt data/lexime.conn
"""

[tasks.fetch-dict-symbols]
description = "Materialize bundled symbols TSV (Greek letters + math symbols)"
sources = [
  "engine/crates/lex-cli/src/bin/dictool.rs",
  "engine/crates/lex-cli/src/dict_source/mod.rs",
  "engine/crates/lex-cli/src/dict_source/symbols.rs",
  "engine/crates/lex-cli/src/dict_source/symbols.tsv",
]
outputs = ["engine/data/symbols-raw/.stamp"]
run = "cd engine && cargo run -p lex-cli --bin dictool -- fetch --source symbols data/symbols-raw"

[tasks.fetch-dict-extras]
description = "Materialize bundled curated domain TSVs (IT, food, geography, ...)"
sources = [
  "engine/crates/lex-cli/src/bin/dictool.rs",
  "engine/crates/lex-cli/src/dict_source/mod.rs",
  "engine/crates/lex-cli/src/dict_source/extras.rs",
  "engine/crates/lex-cli/src/dict_source/extras/*.tsv",
]
outputs = ["engine/data/extras-raw/.stamp"]
run = "cd engine && cargo run -p lex-cli --bin dictool -- fetch --source extras data/extras-raw"

[tasks.dict]
description = "Build merged dictionary (Mozc + bundled symbols + curated extras)"
depends = ["fetch-dict-mozc", "fetch-dict-symbols", "fetch-dict-extras"]
sources = [
  "engine/data/mozc-raw/.stamp",
  "engine/data/mozc-raw/id.def",
  "engine/data/symbols-raw/.stamp",
  "engine/data/extras-raw/.stamp",
  "engine/crates/lex-cli/src/dict_source/symbols.tsv",
  "engine/crates/lex-cli/src/dict_source/extras/*.tsv",
  "engine/crates/**/*.rs",
  "engine/crates/**/*.toml",
  "engine/Cargo.toml",
  "engine/Cargo.lock",
]
outputs = ["engine/data/lexime.dict"]
run = """
#!/usr/bin/env bash
set -euo pipefail
cd engine
cargo build --release -p lex-cli --bin dictool
target/release/dictool compile \
  --source mozc \
  --id-def data/mozc-raw/id.def \
  --extra-source symbols:data/symbols-raw \
  --extra-source extras:data/extras-raw \
  data/mozc-raw data/lexime.dict
"""

[tasks.dict-clean]
description = "Remove compiled dictionaries (forces rebuild on next dict/build)"
run = """
#!/usr/bin/env bash
rm -f engine/data/lexime-mozc.dict engine/data/lexime.dict engine/data/lexime.conn
echo "Removed compiled dictionaries"
"""

[tasks.build]
description = "Build Lexime.app (universal binary)"
depends = ["uniffi-gen", "dict", "conn"]
sources = [
  "Sources/**/*.swift",
  "generated/lex_engine.swift",
  "generated/lex_engineFFI.h",
  "generated/lex_engineFFI.modulemap",
  "build/liblex_engine.a",
  "engine/data/lexime.dict",
  "engine/data/lexime.conn",
  "Info.plist",
  "Resources/icon.tiff",
  "Resources/icon-roman.tiff",
  "Resources/en.lproj/InfoPlist.strings",
  "Resources/en.lproj/Localizable.strings",
  "Resources/ja.lproj/InfoPlist.strings",
  "Resources/ja.lproj/Localizable.strings",
]
outputs = ["build/Lexime.app/Contents/MacOS/Lexime"]
run = """
#!/usr/bin/env bash
set -euo pipefail
rm -f ~/Library/Logs/Lexime/lexime-trace.jsonl
APP=build/Lexime.app
MACOS=$APP/Contents/MacOS
RES=$APP/Contents/Resources
MACOS_MIN=13.0
SWIFTC_FLAGS="-O -Xcc -fmodule-map-file=generated/lex_engineFFI.modulemap"
LINK_FLAGS="-Lbuild -llex_engine"
SWIFT_SOURCES=$(find Sources -name '*.swift' -type f)

mkdir -p "$MACOS" "$RES"
swiftc $SWIFTC_FLAGS $LINK_FLAGS -target x86_64-apple-macosx$MACOS_MIN \
  generated/lex_engine.swift $SWIFT_SOURCES -o "$MACOS/Lexime-x86_64"
swiftc $SWIFTC_FLAGS $LINK_FLAGS -target arm64-apple-macosx$MACOS_MIN \
  generated/lex_engine.swift $SWIFT_SOURCES -o "$MACOS/Lexime-arm64"
lipo -create "$MACOS/Lexime-x86_64" "$MACOS/Lexime-arm64" -output "$MACOS/Lexime"
rm "$MACOS/Lexime-x86_64" "$MACOS/Lexime-arm64"
cp Info.plist "$APP/Contents/Info.plist"
cp Resources/icon.tiff "$RES/icon.tiff"
cp Resources/icon-roman.tiff "$RES/icon-roman.tiff"
rm -rf "$RES/en.lproj" "$RES/ja.lproj"
cp -R Resources/en.lproj "$RES/en.lproj"
cp -R Resources/ja.lproj "$RES/ja.lproj"
cp engine/data/lexime.dict "$RES/"
cp engine/data/lexime.conn "$RES/"
codesign -f -s - "$APP"
echo "Build complete: $APP"
"""

[tasks.install]
description = "Install Lexime.app to ~/Library/Input Methods"
depends = ["build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
INSTALL_DIR="$HOME/Library/Input Methods"
mkdir -p "$INSTALL_DIR"
rm -rf "$INSTALL_DIR/Lexime.app"
cp -R build/Lexime.app "$INSTALL_DIR/Lexime.app"
echo "Installed to $INSTALL_DIR/Lexime.app"
"""

[tasks.reload]
description = "Restart Lexime (macOS auto-restarts input methods)"
run = """
#!/usr/bin/env bash
pkill -x Lexime || true
echo "Sent kill signal to Lexime (macOS will auto-restart it)"
"""

[tasks.log]
description = "Stream Lexime log output"
run = """log stream --predicate 'process == "Lexime"' --style compact"""

[tasks.icon]
description = "Generate icon assets"
run = "bash scripts/icon.sh"

[tasks.test-swift]
description = "Run Swift unit tests (UniFFI round-trip)"
depends = ["uniffi-gen"]
# NOTE: Test files are listed explicitly because swiftc compiles all sources
# into one binary. If you add a new test file under Tests/, add it here too.
# Source files required by tests are also listed explicitly (SnippetTOML for
# TestSnippetTOML; CandidateManager/SessionCoordinator/ModeController/InputSource
# for the controller tests). This list decides what is *linked and run*, not
# what is type-checked: `typecheck-swift` below globs all of Sources/, so a
# file absent from here still gets compiled by CI — it just has no test
# driving it. Add the sources a change touches. EngineContainer costs ~0.15s
# of build time
# (measured, 6 alternating runs); EngineInitFailure is split out so files that
# only need to *render* a failure do not pull the engine-loading path with it.
# LeximeInputController stays out of the *test* binary because it needs IMKit;
# the part of it worth asserting — that menu() feeds the polled issues into
# DegradedStatus.rows — is therefore unpinned by tests, which the PR verifies
# by hand on the real IME. It is still type-checked (see `typecheck-swift`).
run = """
#!/usr/bin/env bash
set -euo pipefail
mkdir -p build
swiftc -Xcc -fmodule-map-file=generated/lex_engineFFI.modulemap \
  -Lbuild -llex_engine \
  generated/lex_engine.swift \
  Sources/Services/SnippetTOML.swift \
  Sources/InputSource.swift \
  Sources/CandidateManager.swift \
  Sources/Controller/SessionCoordinator.swift \
  Sources/Controller/ModeController.swift \
  Sources/Controller/DegradedStatus.swift \
  Sources/EngineInitFailure.swift \
  Sources/EngineContainer.swift \
  Sources/Services/EngineControlService.swift \
  Tests/TestRunner.swift Tests/TestRomajiFFI.swift Tests/TestDictFFI.swift Tests/TestSessionFFI.swift Tests/TestSnippetTOML.swift \
  Tests/TestFakes.swift Tests/TestCandidateManager.swift Tests/TestModeController.swift Tests/TestAbcRevertPolicy.swift Tests/TestInputSourceReverter.swift Tests/TestSessionCoordinator.swift Tests/TestDegradedStatus.swift \
  -o build/test-runner && build/test-runner
"""

[tasks.typecheck-swift]
description = "Type-check every file under Sources/ (the app files the test binary never links)"
depends = ["uniffi-gen"]
# The compensating gate for `test-swift`'s explicit source list (#316). That
# list exists for a real reason — swiftc compiles all sources into one binary,
# and the IMKit/SwiftUI files would drag the headless test runner into linking
# a UI. The bug was that nothing covered the remainder: 13 of 22 files under
# Sources/, `LeximeInputController.swift` among them, were type-checked by no
# gate at all, so a Swift compile error in any of them merged green.
#
# This **globs** rather than enumerating, which is the whole point: a
# hand-maintained second list would drift out of date exactly the way the first
# one did. Whatever is on disk is what gets checked.
#
# `-typecheck` only — no codegen, no linking, no signing, no dictionary build,
# so this stays a per-PR gate rather than a full `mise run build`. It shares
# the `uniffi-gen` output with `test-swift` in the same CI job, so the marginal
# cost is the swiftc front end alone.
run = """
#!/usr/bin/env bash
set -euo pipefail
# Collected with `while read` rather than `mapfile` (bash 3.2 on macOS lacks
# it) and sorted so a failure reproduces in the same order every run. Counted
# in the same pass rather than with bash's array-length form: mise renders this
# block as a Tera template, and that form's opening two characters are Tera's
# comment opener, so the whole task fails to render. Do not reintroduce it —
# not in the script, and not in a comment either.
sources=()
count=0
while IFS= read -r f; do
  sources+=("$f")
  count=$((count + 1))
done < <(find Sources -name '*.swift' | sort)
# A find that silently matches nothing would be a gate that checks nothing —
# the same shape of failure this task exists to close.
if [ "$count" -eq 0 ]; then
  echo "typecheck-swift: no Swift sources under Sources/ — refusing to pass vacuously" >&2
  exit 1
fi
swiftc -typecheck -Xcc -fmodule-map-file=generated/lex_engineFFI.modulemap \
  generated/lex_engine.swift "${sources[@]}"
echo "type-checked $count files under Sources/"
"""

[tasks.explain]
description = "Explain conversion pipeline for a reading"
run = """
cd engine && cargo run --release -p lex-cli --bin lextool -- explain \
  data/lexime.dict "$@" --conn data/lexime.conn
"""

[tasks.snapshot]
description = "Generate conversion snapshot"
depends = ["dict", "conn"]
run = """
cd engine && cargo run --release -p lex-cli --bin lextool -- snapshot \
  data/lexime.dict data/lexime.conn \
  testcorpus/snapshot-readings.txt data/snapshot.jsonl -n 5
"""

[tasks.accuracy]
description = "Run conversion accuracy tests"
depends = ["dict", "conn"]
run = """
cd engine && cargo run --release -p lex-cli --bin lextool -- accuracy \
  data/lexime.dict data/lexime.conn \
  testcorpus/accuracy-corpus.toml "$@"
"""

[tasks.accuracy-history]
description = "Run accuracy tests with history"
depends = ["dict", "conn"]
run = """
cd engine && cargo run --release -p lex-cli --bin lextool -- accuracy \
  data/lexime.dict data/lexime.conn \
  testcorpus/accuracy-corpus-history.toml "$@"
"""

[tasks.diff-snapshot]
description = "Compare current output against baseline snapshot"
depends = ["dict", "conn"]
run = """
cd engine && cargo run --release -p lex-cli --bin lextool -- diff-snapshot \
  data/lexime.dict data/lexime.conn \
  testcorpus/snapshot-readings.txt data/snapshot.jsonl -n 5
"""

[tasks.history-audit]
description = "Audit user history against raw engine top-1"
depends = ["dict", "conn"]
run = """
cd engine && cargo run --release -p lex-cli --bin lextool -- history-audit \
  data/lexime.dict data/lexime.conn \
  "$HOME/Library/Application Support/Lexime/user_history.lxud" "$@"
"""

[tasks.trace-log]
description = "Stream trace JSONL output"
run = "tail -f ~/Library/Logs/Lexime/lexime-trace.jsonl | python3 -m json.tool --no-ensure-ascii"

[tasks.fetch-model]
description = "Download Zenzai GGUF model"
run = """
#!/usr/bin/env bash
set -euo pipefail
mkdir -p data
if [ -f data/zenz-v3.1-Q5_K_M.gguf ]; then
  echo "Model already exists at data/zenz-v3.1-Q5_K_M.gguf"
  exit 0
fi
echo "Downloading zenz-v3.1-small-gguf (Q5_K_M, ~74MB)..."
curl -L -o data/zenz-v3.1-Q5_K_M.gguf \
  "https://huggingface.co/Miwa-Keita/zenz-v3.1-small-gguf/resolve/main/ggml-model-Q5_K_M.gguf"
echo "Downloaded to data/zenz-v3.1-Q5_K_M.gguf"
"""

[tasks.neural-score]
description = "Run neural scoring benchmark"
depends = ["fetch-model", "dict", "conn"]
run = """
cd engine && cargo run -p lex-cli --features neural --bin dictool -- neural-score \
  data/lexime.dict data/lexime.conn \
  --model ../data/zenz-v3.1-Q5_K_M.gguf \
  "$@"
"""

[tasks.romaji-export]
description = "Export default romaji mappings to ~/Library/Application Support/Lexime/romaji.toml"
run = """
dir="$HOME/Library/Application Support/Lexime"
mkdir -p "$dir"
cd engine && cargo run -p lex-cli --bin dictool -- romaji-export > "$dir/romaji.toml"
echo "Exported to $dir/romaji.toml"
"""

[tasks.settings-export]
description = "Export default settings to ~/Library/Application Support/Lexime/settings.toml"
run = """
dir="$HOME/Library/Application Support/Lexime"
mkdir -p "$dir"
cd engine && cargo run -p lex-cli --bin dictool -- settings-export > "$dir/settings.toml"
echo "Exported to $dir/settings.toml"
"""

[tasks.bench]
description = "Run criterion benchmarks"
run = "cd engine && cargo bench -p lex-core"

[tasks.lint]
description = "Run cargo fmt --check and clippy"
run = [
  "cd engine && cargo fmt --all --check",
  # --all-targets is load-bearing — see the lint job in .github/workflows/ci.yml
  # for why (benches are in no other gate). Keep the two in step. #299.
  "cd engine && cargo clippy --workspace --all-targets --all-features -- -D warnings",
]

[tasks.audit]
description = "Run supply chain checks (quarantine, build.rs, locked check, cargo-deny, cargo-vet, machete) — mirrors the CI screen + audit jobs"
run = [
  # screening first: cargo check executes build scripts, so the build.rs /
  # quarantine screens must run before anything that builds. In CI these two
  # live in the `screen` job that gates all cargo-invoking jobs; locally
  # there is no job DAG, so they run here, first.
  "bash scripts/check-quarantine.sh",
  "bash scripts/check-build-scripts.sh",
  "cd engine && cargo check --locked",
  "cd engine && cargo deny check",
  "cd engine && cargo vet check",
  "cd engine && cargo machete",
]

[tasks.test]
description = "Run lint + workspace tests"
depends = ["lint"]
run = "cd engine && cargo test --workspace --all-features"

[tasks.clean]
description = "Remove build artifacts"
run = """
#!/usr/bin/env bash
rm -rf build
cd engine && cargo clean
echo "Clean complete"
"""
